# GullyCricket landing page: static files, served straight from disk.
# Install: sudo cp deploy/gullycricket.nginx.conf /etc/nginx/sites-available/gullycricket.kshitijsinghbhati.in
#          sudo ln -s /etc/nginx/sites-available/gullycricket.kshitijsinghbhati.in /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: like the server's other sites, run `sudo certbot --nginx -d gullycricket.kshitijsinghbhati.in`
# once this is live on port 80. Certbot adds the 443 listener and certificate to this file itself.
# (Skip it if Cloudflare's SSL/TLS mode is "Flexible": Cloudflare then only talks to port 80.)

server {
    listen 80;
    server_name gullycricket.kshitijsinghbhati.in;

    root /var/www/gullycricket;
    index index.html;

    include /etc/nginx/snippets/gullycricket-site.conf;
}
