# Shared by the port 80 and 443 server blocks in gullycricket.nginx.conf.
# Install: sudo cp deploy/gullycricket-site.conf /etc/nginx/snippets/

# Fingerprinted bundles (assets/index-3f9a….js) never change, so browsers and Cloudflare keep them a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# The lighting file is large and rarely changes.
location /hdri/ {
    expires 30d;
    try_files $uri =404;
}

# The page itself is always revalidated, so a deploy shows up on the next visit.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

gzip on;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml application/octet-stream;
